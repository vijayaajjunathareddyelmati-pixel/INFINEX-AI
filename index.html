
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>INFINEX AI</title>
<link rel="stylesheet" href="style.css">
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
#profilePic,#menuPic{display:none!important}
#profileLabel{display:block;max-width:100%;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
#profileName{max-width:100%;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;font-size:clamp(11px,3vw,16px)}
</style>
</head>
<body>
<aside id="sidebar">
<h2>∞ INFINEX AI</h2>
<button onclick="newChat()">+ New Chat</button>
<h3>Chat History</h3>
<div id="history"></div>
<button onclick="renameChat()">Rename Chat</button>
<button onclick="clearHistory()">Delete Chat</button>
<button onclick="reminder()">Reminders</button>
<button onclick="showChallenges()">🎯 Challenge Zone</button>
<div id="googleSignIn"></div>
<div id="profile" onclick="toggleProfile()">
<img id="profilePic" src="" alt="Profile">
<span id="profileLabel">Not logged in</span>
</div>
<div id="profileMenu" hidden>
<img id="menuPic" src="" alt="Profile">
<p id="profileName"></p>
<p id="profileEmail"></p>
<button onclick="logout()">Logout</button>
</div>
<div id="authLinks">
  <a href="login.html">Login</a>
  <a href="signup.html">Create Account</a>
</div>
</aside>

<main>
<header>
<div class="logo">
<svg viewBox="0 0 100 100" width="48">
<defs>
<linearGradient id="g">
<stop stop-color="#a855f7"/>
<stop offset="1" stop-color="#38bdf8"/>
</linearGradient>
</defs>
<path d="M10 50 C10 20 40 20 50 50 C60 80 90 80 90 50 C90 20 60 20 50 50 C40 80 10 80 10 50"
fill="none" stroke="url(#g)" stroke-width="8" stroke-linecap="round"/>
</svg>
<h1>INFINEX AI</h1>
</div>
<div><span id="date"></span> <span id="clock"></span></div>
</header>

<section id="chat">
<p>INFINEX AI: Hello! How can I help you today?</p>
</section>

<section id="challengeZone" hidden>
<h2>🎯 Challenge Zone</h2>
<p>Ready for a fun random challenge?</p>
<button onclick="getChallenge()">✨ Get Challenge</button>
<div id="challenge"></div>
</section>

<div id="imagePreview"></div>
<div class="input-area">
<label for="imageInput" class="file-btn">📎 Choose File</label>
<input type="file" id="imageInput" accept="image/*" onchange="previewImage(event)">
<textarea id="msg" placeholder="Ask INFINEX AI anything..." onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();send()}"></textarea>
<button onclick="voice()" title="Voice">🎤</button>
<button onclick="speak()" title="Read answer">🔊</button>
<button onclick="send()" id="sendBtn">Send</button>
</div>
<footer>INFINEX AI · Intelligence Beyond Limits.</footer>
</main>
<script src="script.js"></script>
</body>
</html>
